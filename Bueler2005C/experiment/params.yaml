# @package _global_

# Bueler et al. (2005) test C — isothermal SIA benchmark.
# A circular, time-evolving surface mass balance grows a radially symmetric
# ice dome (Table 2, p. 297). Migrated to the latest IGM dev: unified iceflow
# with the dahunet (SIA-informed) emulator, trained online from scratch.
# NB: run in the `igm19` conda env (TF 2.19 / Keras 3). See README.

core:
  # forcing_Bueler2005C sets state.smb only in update(); skip the post-init
  # module-needs check (it would otherwise falsely flag thk(smb)).
  check_module_needs: false

defaults:

  - /user/conf/inputs@inputs: Bueler2005C
  - /user/conf/processes@processes: forcing_Bueler2005C

  - override /inputs:
    - Bueler2005C
  - override /processes:
    - forcing_Bueler2005C
    - iceflow
    - time
    - thk
  - override /outputs:
    - local
    - plot2d

processes:
  time:
    start: 0.0
    end: 1000.0
    save: 100.0
    cfl: 0.125
  iceflow:
    method: unified
    physics:
      sliding:
        tau_ref: 0.01          # was init_slidingco (renamed on the unified stack)
      viscosity:
        arrhenius: 100.0       # was init_arrhenius (MPa^-3 yr^-1)
    emulator:
      network:
        params:
          backend: cnn
          features: [dsdx, dsdy, grad_s, u_sia, u_weertman]
          nb_out_filter: 32
          nb_layers: 16
          conv_ker_size: 3
          residual: true
    unified:
      mapping: network
      inputs: [thk, usurf, arrhenius, tau_ref, dX]
      network:
        pretrained: false
        architecture: dahunet
      optimizer: adam
      adam:
        lr: 5.0e-04
        lr_init: 1.0e-03
      nbit_init: 500
      nbit: 1
      nbit_warmup: -1
      retrain_freq: 1
      data_preparation:
        framesizemax: 99999

outputs:
  plot2d:
    live: false
  local:
    vars_to_save:
      - topg
      - usurf
      - thk
      - smb
      - velbar_mag
      - velsurf_mag
      - velbase_mag

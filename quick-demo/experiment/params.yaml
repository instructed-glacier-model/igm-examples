# @package _global_

defaults:
  - override /inputs: 
    - oggm_shop
    - local
  - override /processes:
    - climate
    - smb
    - iceflow
    - time
    - thk
  - override /outputs:
    - local
    - live_dashboard

inputs:
  oggm_shop:
    RGI_ID: "RGI2000-v7.0-G-11-02596"
    thk_source: millan_ice_thickness

processes:
  time:
    start: 2020.0
    end: 2100.0
    save: 10.0
  iceflow:
    physics:
      sliding:
        slidingco: 0.25
  climate:
    method: oggm
    oggm:
      clim_trend_array:
        - ["time", "delta_temp", "prec_scal"]
        - [ 1900,           0.0,         1.0]
        - [ 2020,           0.0,         1.0]
        - [ 2100,           4.0,         1.0]
  smb:
    method: oggm

# @package _global_

defaults:
  - override /inputs: 
    - oggm_shop
    - local
  - override /processes:
    - climate
    - smb
    - iceflow
    - time
    - thk
  - override /outputs:
    - local
    - live_dashboard

inputs:
  oggm_shop:
    RGI_ID: "RGI2000-v7.0-G-11-02596"
    thk_source: millan_ice_thickness

processes:
  time:
    start: 2020.0
    end: 2100.0
    save: 10.0
  # iceflow runs on the default unified dahunet emulator; only the (non-default)
  # sliding is kept.
  iceflow:
    physics:
      sliding:
        tau_ref: 0.2      # basal shear stress (MPa) at the reference speed u_ref
        u_ref: 35.0       # tau_ref IS tau_b at a 35 m/yr sliding speed
  climate:
    method: oggm
    oggm:
      clim_trend_array:
        - ["time", "delta_temp", "prec_scal"]
        - [ 1900,           0.0,         1.0]
        - [ 2020,           0.0,         1.0]
        - [ 2100,           4.0,         1.0]
  smb:
    method: oggm

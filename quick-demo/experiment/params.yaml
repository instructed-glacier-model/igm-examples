# @package _global_

defaults:
  - override /inputs: 
    - oggm_shop
    - local
  - override /processes:
    - climate
    - smb
    - iceflow
    - time
    - thk
  - override /outputs:
    - local
    - live_dashboard

inputs:
  oggm_shop:
    RGI_ID: "RGI2000-v7.0-G-11-02596"
    thk_source: millan_ice_thickness

processes:
  time:
    start: 2020.0
    end: 2100.0
    save: 10.0
  # Unified iceflow with the dahunet (SIA-informed) emulator, trained online
  # from scratch. Replaces the deprecated `emulated` mode + NiceNet network.
  iceflow:
    method: unified
    physics:
      sliding:
        tau_ref: 0.25     # was slidingco (renamed on the new unified stack)
    emulator:
      network:
        params:
          backend: cnn
          features: [dsdx, dsdy, grad_s, u_sia, u_weertman]
          nb_out_filter: 32
          nb_layers: 16
          conv_ker_size: 3
          residual: true
    unified:
      mapping: network
      inputs: [thk, usurf, arrhenius, tau_ref, dX]
      network:
        pretrained: false
        architecture: dahunet
      optimizer: adam
      adam:
        lr: 5.0e-04
        lr_init: 1.0e-03
      nbit_init: 500
      nbit: 1
      nbit_warmup: -1
      retrain_freq: 1
      data_preparation:
        framesizemax: 99999
  climate:
    method: oggm
    oggm:
      clim_trend_array:
        - ["time", "delta_temp", "prec_scal"]
        - [ 1900,           0.0,         1.0]
        - [ 2020,           0.0,         1.0]
        - [ 2100,           4.0,         1.0]
  smb:
    method: oggm

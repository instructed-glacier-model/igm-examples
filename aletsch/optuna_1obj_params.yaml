# Single-objective Optuna config for Aletsch (Step 5).
# Optimizes weight_accumulation and weight_ablation to minimize the DEM misfit
# (mean STD across the 7 historical observation years).

objectives:
  - name: cost_usurf
    direction: minimize

n_trials: 50
n_jobs: 4
gpu_allow_growth: true

storage: sqlite:///optuna.db
study_name: aletsch

sampler:
  method: TPESampler

parameters:
  - name: processes.smb_accmelt.weight_accumulation
    type: float
    low: 0.5
    high: 2.0
    log: false

  - name: processes.smb_accmelt.weight_ablation
    type: float
    low: 0.5
    high: 2.0
    log: false

# @package _global_

# Step 1: Simple ELA-based SMB (legacy mode, as in IGM 3.1.1)  - override /inputs:

defaults:
  - override /inputs:       # load the local model input file to read data
    - local
  - override /processes:
    - smb
    - iceflow
    - time
    - thk
  - override /outputs:
    - local
    - live_dashboard

inputs:
  local:
    filename: input.nc

processes:
  smb:
    method: simple
    simple:
      array:
        - ["time", "gradabl", "gradacc", "ela", "accmax"]
        - [1900, 0.009, 0.005, 2800, 2.0]
        - [2000, 0.009, 0.005, 2900, 2.0]
        - [2100, 0.009, 0.005, 3300, 2.0]
  time:
    start: 1900.0
    end: 2000.0
    save: 10.0

  # This are the parameters to switch the behaviour of IGM 3.1.1.
  iceflow:
    method: emulated
    numerics:
      Nz: 10                  
    physics:
      sliding:
        u_ref: 1.0            

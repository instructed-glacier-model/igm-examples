# @package _global_

# Step 4: With particle tracking
# Same as Step 3, but adds particle tracking to visualize ice flow paths. 
# Uses custom seeding from a spatial map.

defaults:
  - common: iceflow_offline  # load params of the off-line trained iceflow emulator
  
  - /user/conf/processes@processes:
      - smb_accmelt
      - clim_aletsch
      - track_usurf_obs

  - override /inputs:
    - local
  - override /processes:
    - track_usurf_obs
    - clim_aletsch
    - smb_accmelt
    - iceflow
    - time
    - thk
    - rockflow   # rockflow module is needed for particle tracking
    - particles  # load particle tracking module
  - override /outputs:
    - local
    - plot2d

inputs:
  local:
    filename: input.nc

processes:
  smb_accmelt:
    weight_accumulation: 1.84
    weight_ablation: 2.01

  iceflow:
    physics:
      sliding:
        tau_ref: 0.325 # basal shear stress (MPa) required to ...
        u_ref: 100.0   # ... achieve u_ref basal sliding speed (m/yr)

  time:
    start: 1880.0
    end: 2020.0
    save: 1.0
    
  particles:
    seeding:
      method: "user"
      frequency: 500
      density: 1
    tracking:
      method: simple

outputs:
  plot2d:
    live: False
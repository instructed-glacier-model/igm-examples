# @package _global_

# Part B, Step 2: Multi-objective Optuna hyperparameter tuning
#
# Same setup as Part B Step 1 (params_B_1obj), but optimizes two objectives simultaneously:
#   - cost_usurf   : mean STD between modelled and observed DEMs (7 dates)
#   - cost_velsurf : RMSE between modelled and observed surface speeds at 2020
#
# Uses the NSGA-II sampler (a genetic algorithm for multi-objective search)
# instead of TPE, which is better suited for Pareto-front exploration.
#
# Run with:
#   igm_run -m +experiment=params_B_2obj \
#           hydra/sweeper=igm_optuna \
#           hydra.sweeper.optuna_config=optuna_2obj_params.yaml
#
# Single (non-optimized) run:
#   igm_run +experiment=params_B_2obj

defaults:
  - common: iceflow_offline

  - /user/conf/processes@processes:
      - smb_accmelt
      - clim_aletsch
      - track_usurf_obs
      - track_velsurf_obs

  - override /inputs:
    - local
  - override /processes:
    - track_usurf_obs
    - track_velsurf_obs
    - clim_aletsch
    - smb_accmelt
    - iceflow
    - time
    - thk
  - override /outputs:
    - local

inputs:
  local:
    filename: input.nc

processes:
  smb_accmelt:
    weight_accumulation: 1.84
    weight_ablation: 2.01

  iceflow:
    physics: 
      sliding: 
        tau_ref: 0.325 # basal shear stress (MPa) required to ...
        u_ref: 100.0   # ... achieve u_ref basal sliding speed (m/yr)
        
  time:
    start: 1880.0
    end: 2020.0
    save: 10.0

outputs:
  local:
    output_file: output.nc
    output_ts_file: output_ts.nc
    write_ts: True
    vars_to_save:
      - topg
      - usurf
      - thk
      - smb
      - velsurf_mag
      - uvelsurf
      - vvelsurf

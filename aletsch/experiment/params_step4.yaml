# @package _global_

# Step 4: With particle tracking
# Same as Step 3, but adds particle tracking to visualize ice flow paths.
# Uses custom seeding from a spatial map.

defaults:
  - /user/conf/processes@processes.smb_accmelt: smb_accmelt
  - /user/conf/processes@processes.clim_aletsch: clim_aletsch
  - /user/conf/processes@processes.track_usurf_obs: track_usurf_obs

  - override /inputs:
    - local
  - override /processes:
    - track_usurf_obs
    - clim_aletsch
    - smb_accmelt
    - iceflow
    - time
    - thk
    - rockflow
    - particles
  - override /outputs:
    - local
    - plot2d

inputs:
  local:
    filename: input.nc

processes:
  smb_accmelt:
    weight_accumulation: 1.062
    weight_ablation: 1.304
  # Unified iceflow with the dahunet (SIA-informed) emulator, trained online
  # from scratch. Replaces the deprecated `emulated` mode + NiceNet network.
  # `vert_flow` was folded into iceflow on dev; the `simple` particle tracking
  # used here does not need the vertical velocity, so it stays disabled.
  iceflow:
    method: unified
    physics:
      sliding:
        tau_ref: 0.0595   # was slidingco (renamed on the new unified stack)
    emulator:
      network:
        params:
          backend: cnn
          features: [dsdx, dsdy, grad_s, u_sia, u_weertman]
          nb_out_filter: 32
          nb_layers: 16
          conv_ker_size: 3
          residual: true
    unified:
      mapping: network
      inputs: [thk, usurf, arrhenius, tau_ref, dX]
      network:
        pretrained: false
        architecture: dahunet
      optimizer: adam
      adam:
        lr: 5.0e-04
        lr_init: 1.0e-03
      nbit_init: 500
      nbit: 1
      nbit_warmup: -1
      retrain_freq: 1
      data_preparation:
        framesizemax: 99999
  time:
    start: 1880.0
    end: 2020.0
    save: 1.0
  particles:
    seeding:
      method: "user"
      frequency: 500
      density: 1
    tracking:
      method: simple

outputs:
  plot2d:
    live: False
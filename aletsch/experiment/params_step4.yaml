# @package _global_

# Step 4: With particle tracking
# Same as Step 3, but adds particle tracking to visualize ice flow paths.
# Uses custom seeding from a spatial map.

defaults:
  - /user/conf/processes@processes:
      - smb_accmelt
      - clim_aletsch
      - track_usurf_obs

  - override /inputs:
    - local
  - override /processes:
    - track_usurf_obs
    - clim_aletsch
    - smb_accmelt
    - iceflow
    - time
    - thk
    - rockflow
    - particles
  - override /outputs:
    - local
    - plot2d

inputs:
  local:
    filename: input.nc

processes:
  smb_accmelt:
    weight_accumulation: 1.062
    weight_ablation: 1.304

  iceflow:
    physics:
      sliding:
        tau_ref: 0.2      # basal shear stress (MPa) at the reference speed u_ref
        u_ref: 35.0       # tau_ref IS tau_b at a typical ~35 m/yr Aletsch trunk speed

  time:
    start: 1880.0
    end: 2020.0
    save: 1.0
    
  particles:
    seeding:
      method: "user"
      frequency: 500
      density: 1
    tracking:
      method: simple

outputs:
  plot2d:
    live: False
# @package _global_

# Step 4: With particle tracking
# Same as Step 3, but adds particle tracking to visualize ice flow paths.
# Uses custom seeding from a spatial map.

core:
  url_data: "https://www.dropbox.com/scl/fo/8ixpy27i67s04bp7uixoq/h?rlkey=0ye7rd4zkcqfhvzx7suunw3bk&dl=0"

defaults:
  - /user/conf/processes@processes.smb_accmelt: smb_accmelt
  - /user/conf/processes@processes.clim_aletsch: clim_aletsch
  - /user/conf/processes@processes.track_usurf_obs: track_usurf_obs

  - override /inputs:
    - local
  - override /processes:
    - track_usurf_obs
    - clim_aletsch
    - smb_accmelt
    - iceflow
    - time
    - thk
    - rockflow
    - vert_flow
    - particles
  - override /outputs:
    - local
    - plot2d

inputs:
  local:
    filename: input.nc

processes:
  smb_accmelt:
    weight_accumulation: 1.062
    weight_ablation: 1.304
  iceflow:
    physics:
      sliding:
        slidingco: 0.0595
  time:
    start: 1880.0
    end: 2020.0
    save: 1.0
  particles:
    seeding:
      method: "user"
      frequency: 500
      density: 1
    tracking:
      method: simple

outputs:
  plot2d:
    live: False
# @package _global_

# Part D, Step 2: Synthetic-benchmark ice-thickness field_inversion
#
# Uses the field_inversion module to invert for ice thickness
# Input data includes a true thickness field, for comparison with the inverted thickness
# IGM is run forwards in time with a predefined thickness field to obtain ice velocities
# These ice velocities can then be used as synthetic observations to validate the inversion.
#
# Run with:
#   igm_run +experiment=params_D_synthetic

defaults:
  - common: iceflow_online
  
  - /user/conf/outputs@outputs: inverse_accuracy

  - override /inputs:
    - local
  - override /assimilations:
    - field_inversion
  - override /processes:
    - iceflow
  - override /outputs:
    - local
    - inverse_accuracy

inputs:
  local:
    filename: inverse_250m.nc
    
processes:
  iceflow:
    physics:
      sliding:
        tau_ref: 0.15  # basal shear stress (MPa) required to ...
        u_ref: 100.0   # ... achieve u_ref basal sliding speed (m/yr)
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal : q1
    method: unified
    unified:
      display:
        print_cost: true
      mapping: network
      optimizer: lbfgs
      line_search: hager-zhang
      nbit: -1
      nbit_warmup: -1
      nbit_init: -1
      retrain_freq: 1000000
      network:
        pretrained_path: "dahunet_mini.keras"  # shipped inside the igm package
        pretrained: true
assimilations:
  field_inversion:
    variables:
      - name: thk
        transform: identity
        lower_bound: 0.0
        upper_bound: 1000.0
    objective:
      misfit:
        - name: velsurf
          kind: huber
          components: [uvelsurf, vvelsurf]
          obs: [uvelsurfobs, vvelsurfobs]
          std: 1.0
      regularization:
        - name: thk
          penalty: squared_laplacian
          lam: 1000000.0
          ref: usurf
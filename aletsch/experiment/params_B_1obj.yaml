# @package _global_

# Part B, Step 1: Single-objective Optuna hyperparameter tuning
# Uses the Optuna sweeper to find optimal weight_accumulation and weight_ablation
# parameters that minimize the misfit with observed DEMs (mean STD from track_usurf_obs).
# Optimization settings live in optuna_1obj_params.yaml.
# Run with:
#   igm_run -m +experiment=params_B_1obj \
#           hydra/sweeper=igm_optuna \
#           hydra.sweeper.optuna_config=optuna_1obj_params.yaml
# Or without Optuna (single run): igm_run +experiment=params_B_1obj

defaults:
  - common: iceflow_offline

  - /user/conf/processes@processes:
      - smb_accmelt
      - clim_aletsch
      - track_usurf_obs

  - override /inputs:
    - local
  - override /processes:
    - track_usurf_obs
    - clim_aletsch
    - smb_accmelt
    - iceflow
    - time
    - thk

inputs:
  local:
    filename: input.nc

processes:
  smb_accmelt:
    weight_accumulation: 1.84
    weight_ablation: 2.01

  iceflow:
    physics:
      sliding:
        tau_ref: 0.325 # basal shear stress (MPa) required to ...
        u_ref: 100.0   # ... achieve u_ref basal sliding speed (m/yr)

  time:
    start: 1880.0
    end: 2020.0
    save: 10.0


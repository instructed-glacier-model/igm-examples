# @package _global_

# Step 2: Custom user-defined SMB module
# Same as Step 1, but replaces the built-in smb_simple with a custom user
# module (mysmb) that uses a sinusoidal ELA signal. This demonstrates how
# to write and plug in your own process module.

defaults:
  - /user/conf/processes@processes: mysmb

  - override /inputs:
    - local
  - override /processes:
    - mysmb
    - iceflow
    - time
    - thk
  - override /outputs:
    - local
    - live_dashboard

inputs:
  local:
    filename: input.nc

processes:
  time:
    start: 1900.0
    end: 2300.0
    save: 10.0

  # iceflow uses the default unified dahunet emulator; only sliding is set.
  iceflow:
    physics:
      sliding:
        tau_ref: 0.2      # basal shear stress (MPa) at the reference speed u_ref
        u_ref: 35.0       # tau_ref IS tau_b at a typical ~35 m/yr Aletsch trunk speed

# @package _global_

# Step 2: Custom user-defined SMB module
# Same as Step 1, but replaces the built-in smb_simple with a custom user
# module (mysmb) that uses a sinusoidal ELA signal. This demonstrates how
# to write and plug in your own process module.

core:
  # mysmb sets state.smb only in update(); skip the post-init module-needs check
  # (it would otherwise falsely flag thk(smb)).
  check_module_needs: false

defaults:
  - /user/conf/processes@processes: mysmb

  - override /inputs:
    - local
  - override /processes:
    - mysmb
    - iceflow
    - time
    - thk
  - override /outputs:
    - local
    - live_dashboard

inputs:
  local:
    filename: input.nc

processes:
  time:
    start: 1900.0
    end: 2000.0
    save: 10.0

  # Unified iceflow with the dahunet (SIA-informed) emulator, trained online
  # from scratch. Replaces the deprecated `emulated` mode + NiceNet network.
  iceflow:
    method: unified
    emulator:
      network:
        params:
          backend: cnn
          features: [dsdx, dsdy, grad_s, u_sia, u_weertman]
          nb_out_filter: 32
          nb_layers: 16
          conv_ker_size: 3
          residual: true
    unified:
      mapping: network
      inputs: [thk, usurf, arrhenius, tau_ref, dX]
      network:
        pretrained: false
        architecture: dahunet
      optimizer: adam
      adam:
        lr: 5.0e-04
        lr_init: 1.0e-03
      nbit_init: 500
      nbit: 1
      nbit_warmup: -1
      retrain_freq: 1
      data_preparation:
        framesizemax: 99999


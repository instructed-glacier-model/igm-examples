# @package _global_

# Step 6: Multi-objective Optuna parameter optimization
#
# Same setup as Step 5, but optimizes two objectives simultaneously:
#   - cost_usurf   : mean STD between modelled and observed DEMs (7 dates)
#   - cost_velsurf : RMSE between modelled and observed surface speeds at 2020
#
# Uses the NSGA-II sampler (a genetic algorithm for multi-objective search)
# instead of TPE, which is better suited for Pareto-front exploration.
#
# Run with:
#   igm_run -m +experiment=params_step6 \
#           hydra/sweeper=igm_optuna \
#           hydra.sweeper.optuna_config=optuna_2obj_params.yaml
#
# Single (non-optimized) run:
#   igm_run +experiment=params_step6

defaults:
  - /user/conf/processes@processes.smb_accmelt: smb_accmelt
  - /user/conf/processes@processes.clim_aletsch: clim_aletsch
  - /user/conf/processes@processes.track_usurf_obs: track_usurf_obs
  - /user/conf/processes@processes.track_velsurf_obs: track_velsurf_obs

  - override /inputs:
    - local
  - override /processes:
    - track_usurf_obs
    - track_velsurf_obs
    - clim_aletsch
    - smb_accmelt
    - iceflow
    - time
    - thk
  - override /outputs:
    - local

inputs:
  local:
    filename: input.nc

processes:
  smb_accmelt:
    weight_accumulation: 1.062
    weight_ablation: 1.304
  iceflow:
    physics:
      # With u_ref = 35 m/yr (a typical basal speed for Aletsch), `slidingco`
      # IS the basal shear stress τ_b (MPa) at that reference speed:
      #     τ_b = slidingco · (|u_b| / u_ref)^(1/m),  m = 3
      # Literature range for a temperate alpine glacier: 0.08–0.30 MPa.
      init_slidingco: 0.15
      sliding:
        weertman:
          u_ref: 35.0
  time:
    start: 1880.0
    end: 2020.0
    save: 10.0

outputs:
  local:
    output_file: output.nc
    output_ts_file: output_ts.nc
    write_ts: True
    vars_to_save:
      - topg
      - usurf
      - thk
      - smb
      - velsurf_mag
      - uvelsurf
      - vvelsurf

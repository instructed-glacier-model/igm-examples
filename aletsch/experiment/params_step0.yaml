# @package _global_

# Step 0: Fully offline (pretrained) emulator
# Same simple ELA-based advance-retreat simulation as Step 1 (built-in smb_simple),
# but run with a fully offline iceflow emulator: a pretrained network is loaded and
# used as-is, with no on-the-fly retraining during the run. 

# NB: the pretrained emulator is currently only compatible with Nz=2 and a molho
# vertical discretization, so a direct comparison with Step 1 does not make sense.

core:
  url_data: "https://www.dropbox.com/scl/fo/8ixpy27i67s04bp7uixoq/h?rlkey=0ye7rd4zkcqfhvzx7suunw3bk&dl=0"

defaults:
  - override /inputs:
    - local
  - override /processes:
    - smb
    - iceflow
    - time
    - thk
  - override /outputs:
    - local

inputs:
  local:
    filename: input.nc

processes:
  smb:
    method: simple
    simple:
      array:
        - ["time", "gradabl", "gradacc", "ela", "accmax"]
        - [1900, 0.009, 0.005, 2800, 2.0]
        - [2000, 0.009, 0.005, 2900, 2.0]
        - [2100, 0.009, 0.005, 3300, 2.0]
  time:
    start: 1900.0
    end: 2000.0
    save: 10.0

  iceflow:
    method: unified
    numerics:
      Nz: 2
      basis_horizontal: q1
      basis_vertical: molho
    unified:
      mapping: network
      nbit: -1
      nbit_warmup: -1
      nbit_init: -1
      retrain_freq: 1000000000000
      network:
        pretrained_path: /home/srosier/work/igm3/igm/processes/iceflow/emulate/emulators/dahunet_mini.keras
        pretrained: true
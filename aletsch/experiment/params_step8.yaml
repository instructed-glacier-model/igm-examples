# @package _global_

# Step 8: Data assimilation by time relaxation (T. Frank's method)
#
# Instead of a one-shot inversion (Step 7), this runs the forward ice-flow model
# for 500 years while *nudging* three control fields a little at every time step,
# so the modelled glacier slowly relaxes onto the observations. By the end the
# geometry, mass balance and velocity are mutually consistent and match the data.
#
# This is IGM's `time_relaxation` assimilation module (forward time-relaxation
# data assimilation; original implementation by T. Frank). It is fully generic:
# a run is a list of independent `steps`, each an orthogonal triple
# (residual, update law, control). Here three steps run together:
#
#   control nudged          driven to match                        step
#   ----------------------  -------------------------------------  ---------
#   thk      (thickness)    flux divergence -> AMB (= smb - dhdt)  amb_thk
#   usurf    (surface)      same AMB residual (amb - divflux)      amb_usurf
#   tau_ref  (friction)     observed surface speed velsurf_magobs  friction
#
# The first two implement the apparent-mass-balance bed inversion of
# Frank & van Pelt (2025): drive divflux toward amb = smb - dhdt_obs by jointly
# perturbing thk and usurf. The third is a classic friction inversion against
# observed surface speeds. See the README for the full method write-up.
#
# Run with:  conda activate igm19 && igm_run +experiment=params_step8
# (long run: ~500 yr forward loop; writes outputs/<date>/<time>/)

core:
  # time_relaxation drives the whole loop and produces amb/divflux/tau_ref
  # internally; skip the post-init module-needs / compat checks.
  check_compat_params: false
  check_module_needs: false

defaults:
  # user conf files follow the built-in template (keys nested under the module
  # name), so they load at the parent group with @processes; list form because
  # both come from the same group.
  - /user/conf/processes@processes:
      - eval_objective
      - fit_dashboard

  - override /inputs:
      - local
  - override /processes:
      - iceflow
      - smb
      - eval_objective
      - fit_dashboard
  - override /assimilations:
      - time_relaxation
  - override /outputs:
      - write_ncdf
      - write_ts

inputs:
  local:
    # geometry + observations: thk, usurf, dhdt, uvelsurfobs/vvelsurfobs,
    # thkobs, icemask (single snapshot).
    filename: input.nc

processes:

  # Unified iceflow with a from-scratch dahunet (SIA-informed) emulator.
  iceflow:
    method: unified
    force_max_velbar: 1000.0
    physics:
      sliding:
        law: weertman
        tau_ref: 0.014           # friction control field (initial value)
      viscosity:
        arrhenius: 108.636
        exponent: 3.0
        regularization: 1.0e-05
    numerics:
      Nz: 10
      vert_spacing: 4.0
    emulator:
      network:
        params:
          backend: cnn
          features: [dsdx, dsdy, grad_s, u_sia, u_weertman]
          nb_out_filter: 96
          nb_layers: 6
          conv_ker_size: 3
          residual: true
    unified:
      inputs: [thk, usurf, arrhenius, tau_ref, dX]
      mapping: network
      bcs: [dirichlet]
      bc:
        dirichlet: { left: null, right: null, top: null, bottom: null }
      network:
        pretrained: false        # from scratch
        architecture: dahunet
      optimizer: adam
      nbit_init: 500
      nbit: 4
      nbit_warmup: -1
      retrain_freq: 1
      adam:
        lr: 0.0001
        lr_init: 0.002
      display:
        print_cost: false

  smb:
    method: simple
    simple:
      update_freq: 1.0
      array:
        - ["time", "gradabl", "gradacc", "ela", "accmax"]
        - [0, 0.007, 0.004, 3050, 2.0]

assimilations:
  time_relaxation:

    forward_model: iceflow
    pre_processes:  [smb]          # refresh state.smb before each iceflow solve
    post_processes: [fit_dashboard]  # live fit maps (speed / AMB / tau_ref) at each save

    viz:
      show: false                 # true -> interactive window (needs a display)
      dpi:  110
      title: Aletsch

    time:
      start: 0.0
      end:   500.0
      step:  0.2
      save:  50.0                  # 11 snapshots (t = 0, 50, ..., 500)
      cfl:   0.3

    steps:

      # --- apparent-mass-balance bed inversion (two coupled geometry steps) ---
      # nudge thk and usurf until the modelled flux divergence equals the
      # apparent mass balance amb = smb - dhdt_obs (a shared linear residual).
      - name: amb_thk
        residual: { kind: linear, target: amb, current: divflux }
        update:   { kind: additive, alpha: 0.138 }
        control:  { field: thk, bounds: [0.0, 2000.0] }
        mask: icemask
        geometry_policy: recompute_topg

      - name: amb_usurf
        shares_residual_with: amb_thk
        residual: { kind: linear, target: amb, current: divflux }
        update:   { kind: additive, alpha: 0.0422 }
        control:  { field: usurf, floor_at: topg }
        mask: icemask
        geometry_policy: recompute_topg

      # --- friction inversion against observed surface speed ---
      # multiply tau_ref by (1 + clip(r)) with r the relative speed mismatch.
      # Applied on a slow cadence; the last kick is scheduled >= 60 yr before
      # scoring so its transient has decayed (see README).
      - name: friction
        residual: { kind: relative, target: velsurf_magobs, current: velsurf_mag, eps: 1.0 }
        update:   { kind: multiplicative_linear, alpha: -1.0, r_max: 0.654 }
        control:  { field: tau_ref, bounds: [1.0e-4, 3.0] }
        mask: icemask
        cadence: 62.0
        end_time: 450.0

    outputs:
      misfits:
        path: misfits.csv
        track:
          - { step: amb_thk,  kind: rmse }
          - { step: friction, kind: rmse }

outputs:
  write_ncdf:
    output_file: output.nc
    vars_to_save:
      - thk
      - topg
      - usurf
      - velbar_mag
      - velsurf_mag
      - tau_ref
      - smb
      - dhdt
      - dhdt_obs
      - velbase_mag
      - velsurf_magobs
      - divflux
      - icemask
      - amb
  write_ts:
    output_file: output_ts.nc

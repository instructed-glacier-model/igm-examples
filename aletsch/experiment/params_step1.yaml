# @package _global_

# Step 1: Simple ELA-based SMB
# Basic advance-retreat simulation of the Aletsch Glacier using smb_simple.
# This is the simplest possible setup with a built-in SMB parameterization.

defaults:
  - override /inputs:
    - local
  - override /processes:
    - smb
    - iceflow
    - time
    - thk
  - override /outputs:
    - local
    - live_dashboard

inputs:
  local:
    filename: input.nc

processes:
  smb:
    method: simple
    simple:
      array:
        - ["time", "gradabl", "gradacc", "ela", "accmax"]
        - [1900, 0.009, 0.005, 2800, 2.0]
        - [2000, 0.009, 0.005, 2900, 2.0]
        - [2100, 0.009, 0.005, 3300, 2.0]
  time:
    start: 1900.0
    end: 2000.0
    save: 10.0

  # iceflow uses the default unified dahunet emulator; only sliding is set.
  iceflow:
    physics:
      sliding:
        tau_ref: 0.2      # basal shear stress (MPa) at the reference speed u_ref
        u_ref: 35.0       # tau_ref IS tau_b at a typical ~35 m/yr Aletsch trunk speed


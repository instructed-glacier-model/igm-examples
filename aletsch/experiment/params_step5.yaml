# @package _global_

# Step 5: Single-objective Optuna parameter optimization
# Uses the Optuna sweeper to find optimal weight_accumulation and weight_ablation
# parameters that minimize the misfit with observed DEMs (mean STD from track_usurf_obs).
# Optimization settings live in optuna_1obj_params.yaml.
# Run with:
#   igm_run -m +experiment=params_step5 \
#           hydra/sweeper=igm_optuna \
#           hydra.sweeper.optuna_config=optuna_1obj_params.yaml
# Or without Optuna (single run): igm_run +experiment=params_step5

defaults:
  - /user/conf/processes@processes.smb_accmelt: smb_accmelt
  - /user/conf/processes@processes.clim_aletsch: clim_aletsch
  - /user/conf/processes@processes.track_usurf_obs: track_usurf_obs

  - override /inputs:
    - local
  - override /processes:
    - track_usurf_obs
    - clim_aletsch
    - smb_accmelt
    - iceflow
    - time
    - thk

inputs:
  local:
    filename: input.nc

processes:
  smb_accmelt:
    weight_accumulation: 1.062
    weight_ablation: 1.304
  # Unified iceflow with the dahunet (SIA-informed) emulator, trained online
  # from scratch. Replaces the deprecated `emulated` mode + NiceNet network.
  iceflow:
    method: unified
    physics:
      sliding:
        tau_ref: 0.0595   # was slidingco (renamed on the new unified stack)
    emulator:
      network:
        params:
          backend: cnn
          features: [dsdx, dsdy, grad_s, u_sia, u_weertman]
          nb_out_filter: 32
          nb_layers: 16
          conv_ker_size: 3
          residual: true
    unified:
      mapping: network
      inputs: [thk, usurf, arrhenius, tau_ref, dX]
      network:
        pretrained: false
        architecture: dahunet
      optimizer: adam
      adam:
        lr: 5.0e-04
        lr_init: 1.0e-03
      nbit_init: 500
      nbit: 1
      nbit_warmup: -1
      retrain_freq: 1
      data_preparation:
        framesizemax: 99999
  time:
    start: 1880.0
    end: 2020.0
    save: 10.0


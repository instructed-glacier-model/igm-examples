# @package _global_

# Step 5: Single-objective Optuna parameter optimization
# Uses the Optuna sweeper to find optimal weight_accumulation and weight_ablation
# parameters that minimize the misfit with observed DEMs (mean STD from track_usurf_obs).
# Optimization settings live in optuna_1obj_params.yaml.
# Run with:
#   igm_run -m +experiment=params_step5 \
#           hydra/sweeper=igm_optuna \
#           hydra.sweeper.optuna_config=optuna_1obj_params.yaml
# Or without Optuna (single run): igm_run +experiment=params_step5

defaults:
  - /user/conf/processes@processes:
      - smb_accmelt
      - clim_aletsch
      - track_usurf_obs

  - override /inputs:
    - local
  - override /processes:
    - track_usurf_obs
    - clim_aletsch
    - smb_accmelt
    - iceflow
    - time
    - thk

inputs:
  local:
    filename: input.nc

processes:
  smb_accmelt:
    weight_accumulation: 1.062
    weight_ablation: 1.304

  iceflow:
    physics:
      sliding:
        tau_ref: 0.2      # basal shear stress (MPa) at the reference speed u_ref
        u_ref: 35.0       # tau_ref IS tau_b at a typical ~35 m/yr Aletsch trunk speed

  time:
    start: 1880.0
    end: 2020.0
    save: 10.0


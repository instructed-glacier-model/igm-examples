# @package _global_

# Step 3: Complex accumulation/melt SMB model
# Uses custom climate (clim_aletsch) and accumulation/melt (smb_accmelt) modules
# to model the Aletsch Glacier from 1880 to 2020. Includes observation tracking
# to compare modelled vs observed surface elevations. No particle tracking.

defaults:
  - /user/conf/processes@processes:
      - smb_accmelt
      - clim_aletsch
      - track_usurf_obs

  - override /inputs:
    - local
  - override /processes:
    - track_usurf_obs
    - clim_aletsch
    - smb_accmelt
    - iceflow
    - time
    - thk
    - rockflow
  - override /outputs:
    - local
    - live_dashboard

inputs:
  local:
    filename: input.nc

processes:
  smb_accmelt:
    weight_accumulation: 1.062
    weight_ablation: 1.304

  iceflow:
    physics:
      sliding:
        tau_ref: 0.2      # basal shear stress (MPa) at the reference speed u_ref
        u_ref: 35.0       # tau_ref IS tau_b at a typical ~35 m/yr Aletsch trunk speed

  time:
    start: 1880.0
    end: 2020.0
    save: 1.0


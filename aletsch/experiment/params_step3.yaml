# @package _global_

# Step 3: Complex accumulation/melt SMB model
# Uses custom climate (clim_aletsch) and accumulation/melt (smb_accmelt) modules
# to model the Aletsch Glacier from 1880 to 2020. Includes observation tracking
# to compare modelled vs observed surface elevations. No particle tracking.

core:
  url_data: "https://www.dropbox.com/scl/fo/8ixpy27i67s04bp7uixoq/h?rlkey=0ye7rd4zkcqfhvzx7suunw3bk&dl=0"

defaults:
  - /user/conf/processes@processes.smb_accmelt: smb_accmelt
  - /user/conf/processes@processes.clim_aletsch: clim_aletsch
  - /user/conf/processes@processes.track_usurf_obs: track_usurf_obs

  - override /inputs:
    - local
  - override /processes:
    - track_usurf_obs
    - clim_aletsch
    - smb_accmelt
    - iceflow
    - time
    - thk
    - rockflow
    - vert_flow
  - override /outputs:
    - local
    - plot2d

inputs:
  local:
    filename: input.nc

processes:
  smb_accmelt:
    weight_accumulation: 1.062
    weight_ablation: 1.304
  iceflow:
    physics:
      init_slidingco: 0.0595
  time:
    start: 1880.0
    end: 2020.0
    save: 1.0

outputs:
  plot2d:
    live: false

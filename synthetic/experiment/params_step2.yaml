# @package _global_

# Step 2: With particle tracking
# Same as Step 1, but adds particle tracking to visualize ice flow paths.

defaults:
  - /user/conf/inputs@inputs: synthetic
  - override /inputs:
    - synthetic
  - override /processes:
    - smb
    - iceflow
    - time
    - thk
    - particles
  - override /outputs:
    - local
    - plot2d

processes:
  time:
    start: 2000.0
    end: 2500.0
    save: 10.0

  iceflow:
    vertical_velocity:
      enabled: true
    physics:
      sliding:
        tau_ref: 0.2      # basal shear stress (MPa) at the reference speed u_ref
        u_ref: 35.0       # tau_ref IS tau_b at a 35 m/yr sliding speed
    unified:
      nbit_init: 0        # starts from zero ice -> no frozen-state warm-up to train on
  smb:
    method: simple
    simple:
      array:
        - ["time", "gradabl", "gradacc", "ela", "accmax"]
        - [ 1900,      0.009,     0.005,  2800,      2.0]
        - [ 2000,      0.009,     0.005,  2900,      2.0]
        - [ 2100,      0.009,     0.005,  3300,      2.0]

outputs:
  plot2d:
    live: true

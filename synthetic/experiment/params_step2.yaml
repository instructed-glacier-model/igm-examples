# @package _global_

# Step 2: With particle tracking
# Same as Step 1, but adds particle tracking to visualize ice flow paths.

core:
  # particles' 3d tracking needs `W`, which iceflow.vertical_velocity produces in
  # update() (before particles runs), not at init; skip the post-init check that
  # would otherwise falsely flag particles(W).
  check_module_needs: false

defaults:
  - /user/conf/inputs@inputs.synthetic: synthetic
  - override /inputs:
    - synthetic
  - override /processes:
    - smb
    - iceflow
    - time
    - thk
    - particles
  - override /outputs:
    - local
    - plot2d

processes:
  time:
    start: 2000.0
    end: 2500.0
    save: 10.0
  # Unified iceflow with the dahunet (SIA-informed) emulator, trained online
  # from scratch. Replaces the deprecated `emulated` mode + NiceNet network.
  # `vert_flow` was folded into iceflow on dev; particle tracking defaults to the
  # `3d` method, which needs the vertical velocity -> vertical_velocity.enabled.
  iceflow:
    method: unified
    vertical_velocity:
      enabled: true
    physics:
      sliding:
        tau_ref: 0.25     # was slidingco (renamed on the new unified stack)
    emulator:
      network:
        params:
          backend: cnn
          features: [dsdx, dsdy, grad_s, u_sia, u_weertman]
          nb_out_filter: 32
          nb_layers: 16
          conv_ker_size: 3
          residual: true
    unified:
      mapping: network
      inputs: [thk, usurf, arrhenius, tau_ref, dX]
      network:
        pretrained: false
        architecture: dahunet
      optimizer: adam
      adam:
        lr: 5.0e-04
        lr_init: 1.0e-03
      nbit_init: 500
      nbit: 1
      nbit_warmup: -1
      retrain_freq: 1
      data_preparation:
        framesizemax: 99999
  smb:
    method: simple
    simple:
      array:
        - ["time", "gradabl", "gradacc", "ela", "accmax"]
        - [ 1900,      0.009,     0.005,  2800,      2.0]
        - [ 2000,      0.009,     0.005,  2900,      2.0]
        - [ 2100,      0.009,     0.005,  3300,      2.0]

outputs:
  plot2d:
    live: true

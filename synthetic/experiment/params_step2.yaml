# @package _global_

# Step 2: With particle tracking
# Same as Step 1, but adds particle tracking to visualize ice flow paths.

defaults:
  - /user/conf/inputs@inputs.synthetic: synthetic
  - override /inputs:
    - synthetic
  - override /processes:
    - smb_simple
    - iceflow
    - time
    - thk
    - vert_flow
    - particles
  - override /outputs:
    - local
    - plot2d

processes:
  time:
    start: 2000.0
    end: 2500.0
    save: 10.0
  iceflow:
    physics:
      init_slidingco: 0.25
    emulator:
      exclude_borders: 10
  smb_simple:
    array:
      - ["time", "gradabl", "gradacc", "ela", "accmax"]
      - [ 1900,      0.009,     0.005,  2800,      2.0]
      - [ 2000,      0.009,     0.005,  2900,      2.0]
      - [ 2100,      0.009,     0.005,  3300,      2.0]

outputs:
  plot2d:
    live: true

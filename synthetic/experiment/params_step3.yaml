# @package _global_

# Step 3: Optuna parameter optimization
# Uses the Optuna sweeper to find optimal sliding coefficient and ELA
# that match target ice volume and surface speed.
# Run with: igm_run -m +experiment=params_step3 hydra/sweeper=igm_optuna
# Or without Optuna (single run): igm_run +experiment=params_step3

defaults:
  - /user/conf/inputs@inputs.synthetic: synthetic
  - /user/conf/processes@processes.eval_objective: eval_objective
  - override /inputs:
    - synthetic
  - override /processes:
    - smb
    - iceflow
    - time
    - thk
    - eval_objective

processes:
  time:
    start: 2000.0
    end: 2300.0
    save: 50.0
  # Unified iceflow with the dahunet (SIA-informed) emulator, trained online
  # from scratch. Replaces the deprecated `emulated` mode + NiceNet network.
  iceflow:
    method: unified
    physics:
      sliding:
        tau_ref: 0.25     # was slidingco (renamed on the new unified stack)
    emulator:
      network:
        params:
          backend: cnn
          features: [dsdx, dsdy, grad_s, u_sia, u_weertman]
          nb_out_filter: 32
          nb_layers: 16
          conv_ker_size: 3
          residual: true
    unified:
      mapping: network
      inputs: [thk, usurf, arrhenius, tau_ref, dX]
      network:
        pretrained: false
        architecture: dahunet
      optimizer: adam
      adam:
        lr: 5.0e-04
        lr_init: 1.0e-03
      nbit_init: 500
      nbit: 1
      nbit_warmup: -1
      retrain_freq: 1
      data_preparation:
        framesizemax: 99999
  smb:
    method: simple
    simple:
      array:
        - ["time", "gradabl", "gradacc", "ela", "accmax"]
        - [ 2000,      0.009,     0.005,  2800,      2.0]

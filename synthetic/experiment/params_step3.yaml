# @package _global_

# Step 3: Optuna parameter optimization
# Uses the Optuna sweeper to find optimal sliding coefficient and ELA
# that match target ice volume and surface speed.
# Run with: igm_run -m +experiment=params_step3 hydra/sweeper=igm_optuna
# Or without Optuna (single run): igm_run +experiment=params_step3

defaults:
  - /user/conf/inputs@inputs: synthetic
  - /user/conf/processes@processes: eval_objective
  - override /inputs:
    - synthetic
  - override /processes:
    - smb
    - iceflow
    - time
    - thk
    - eval_objective

processes:
  time:
    start: 2000.0
    end: 2300.0
    save: 50.0

  iceflow:
    physics:
      sliding:
        tau_ref: 0.2      # basal shear stress (MPa) at the reference speed u_ref
        u_ref: 35.0       # tau_ref IS tau_b at a 35 m/yr sliding speed
    unified:
      nbit_init: 0        # starts from zero ice -> no frozen-state warm-up to train on
  smb:
    method: simple
    simple:
      array:
        - ["time", "gradabl", "gradacc", "ela", "accmax"]
        - [ 2000,      0.009,     0.005,  2800,      2.0]

# @package _global_

core:
  url_data: https://www.dropbox.com/scl/fi/7pib29dhsuo2t80yplu2j/paleo-alps-v1.zip?rlkey=jsyz0qseyv9jqk63vz3lk6mf0&dl=0
  # smb_signal sets state.smb only in update(); skip the post-init module-needs
  # check (it would otherwise falsely flag thk(smb)).
  check_module_needs: false

defaults:
  - /user/conf/processes@processes: smb_signal # Loads the base configuration. Needs to be before an `override` I believe, otherwise, we get an assertion error
  
  - override /inputs: 
    - load_tif
  - override /processes: 
    - smb_signal
    - iceflow
    - time
    - thk
  - override /outputs: 
    - plot2d
    - local
#  - override /hydra/launcher: joblib

inputs:
  load_tif:
    coarsen: 2

processes:
  smb_signal:
    pdela: 3000
    deladt: 200
    gradabl: 0.0067
    gradacc: 0.0005
    maxacc: 1.0
  time:
    start: -30000.0
    end: -25000.0
    save: 100.0

  # iceflow uses the default unified dahunet emulator; only sliding is set.
  iceflow:
    physics:
      sliding:
        tau_ref: 0.82      # basal shear stress (MPa) at the reference speed u_ref
        u_ref: 35.0       # tau_ref IS tau_b at a 35 m/yr sliding speed
    unified:
      nbit_init: 0        # starts from bare bed (zero ice) -> no warm-up to train on

outputs:
  plot2d:
    live: true

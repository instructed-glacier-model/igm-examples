# @package _global_

core:
  url_data: https://www.dropbox.com/scl/fi/7pib29dhsuo2t80yplu2j/paleo-alps-v1.zip?rlkey=jsyz0qseyv9jqk63vz3lk6mf0&dl=0
  # smb_signal sets state.smb only in update(); skip the post-init module-needs
  # check (it would otherwise falsely flag thk(smb)).
  check_module_needs: false

defaults:
  - /user/conf/processes@processes.smb_signal: smb_signal # Loads the base configuration. Needs to be before an `override` I believe, otherwise, we get an assertion error
  
  - override /inputs: 
    - load_tif
  - override /processes: 
    - smb_signal
    - iceflow
    - time
    - thk
  - override /outputs: 
    - plot2d
    - local
#  - override /hydra/launcher: joblib

inputs:
  load_tif:
    coarsen: 2

processes:
  smb_signal:
    pdela: 3000
    deladt: 200
    gradabl: 0.0067
    gradacc: 0.0005
    maxacc: 1.0
  time:
    start: -30000.0
    end: -25000.0
    save: 100.0

  # Unified iceflow with the dahunet (SIA-informed) emulator, trained online
  # from scratch. Replaces the deprecated `emulated` mode + NiceNet network.
  iceflow:
    method: unified
    emulator:
      network:
        params:
          backend: cnn
          features: [dsdx, dsdy, grad_s, u_sia, u_weertman]
          nb_out_filter: 32
          nb_layers: 16
          conv_ker_size: 3
          residual: true
    unified:
      mapping: network
      inputs: [thk, usurf, arrhenius, tau_ref, dX]
      network:
        pretrained: false
        architecture: dahunet
      optimizer: adam
      adam:
        lr: 5.0e-04
        lr_init: 1.0e-03
      nbit_init: 500
      nbit: 1
      nbit_warmup: -1
      retrain_freq: 1
      data_preparation:
        framesizemax: 99999

outputs:
  plot2d:
    live: true
